<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Tic-Tac-Toe</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgDark: '#0b0f19',
                        panelDark: '#151b2b',
                        cellBg: '#1b2336',
                        cellHover: '#243049',
                        neonX: '#00e5ff',
                        neonO: '#ff3d8b',
                        neonGold: '#ffd60a',
                        textMain: '#e8ecf5',
                        textMuted: '#7d8aa8',
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        rajdhani: ['Rajdhani', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0b0f19;
            color: #e8ecf5;
            font-family: 'Rajdhani', sans-serif;
            user-select: none;
            touch-action: manipulation;
        }

        .glow-x {
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.7), 0 0 20px rgba(0, 229, 255, 0.4);
        }

        .glow-o {
            text-shadow: 0 0 10px rgba(255, 61, 139, 0.7), 0 0 20px rgba(255, 61, 139, 0.4);
        }

        .glow-gold {
            text-shadow: 0 0 10px rgba(255, 214, 10, 0.7), 0 0 20px rgba(255, 214, 10, 0.4);
        }

        .box-glow-x {
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.3), inset 0 0 10px rgba(0, 229, 255, 0.1);
        }

        .box-glow-o {
            box-shadow: 0 0 15px rgba(255, 61, 139, 0.3), inset 0 0 10px rgba(255, 61, 139, 0.1);
        }

        .btn-neon-green {
            background: linear-gradient(135deg, #1fae5c, #2ecc71);
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.4);
            transition: all 0.2s ease;
        }
        .btn-neon-green:hover {
            box-shadow: 0 0 25px rgba(46, 204, 113, 0.7);
            transform: translateY(-2px);
        }

        .btn-action {
            transition: all 0.2s ease;
        }
        .btn-action:hover {
            filter: brightness(1.2);
            transform: translateY(-1px);
        }

        /* Flash score animation */
        @keyframes flashAnim {
            0% { color: #ffd60a; transform: scale(1.2); }
            100% { color: #e8ecf5; transform: scale(1); }
        }
        .flash-score {
            animation: flashAnim 0.7s ease-out;
        }

        /* Pulse banner animation */
        @keyframes pulseGlow {
            0%, 100% { opacity: 1; text-shadow: 0 0 12px #ffd60a, 0 0 25px #ffd60a; }
            50% { opacity: 0.85; text-shadow: 0 0 5px #ffffff, 0 0 15px #ffd60a; }
        }
        .pulse-banner {
            animation: pulseGlow 1.2s infinite ease-in-out;
        }

        /* Glass modal overlay */
        .modal-bg {
            background-color: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden">

    <!-- AUDIO MUTE TOGGLE (Top Right) -->
    <button id="soundToggleBtn" onclick="toggleSound()" class="absolute top-4 right-4 z-20 bg-panelDark hover:bg-cellHover text-textMuted hover:text-textMain border border-slate-700/50 p-2.5 rounded-xl transition duration-200 flex items-center gap-2 text-sm font-semibold shadow-lg">
        <span id="soundIcon">🔊</span>
        <span id="soundText" class="hidden sm:inline">SFX ON</span>
    </button>

    <!-- START SCREEN -->
    <div id="startScreen" class="w-full max-w-md bg-panelDark p-6 sm:p-8 rounded-3xl border border-slate-800 shadow-2xl z-10 flex flex-col items-center">
        <!-- Title Header -->
        <div class="flex items-center gap-3 font-orbitron text-3xl sm:text-4xl font-black mb-1">
            <span class="text-neonX glow-x">X</span>
            <span class="text-textMain tracking-wider">TIC TAC TOE</span>
            <span class="text-neonO glow-o">O</span>
        </div>
        <p class="text-textMuted text-xs sm:text-sm font-semibold tracking-widest uppercase mb-8">Two players • One screen • Zero mercy</p>

        <!-- Name Inputs -->
        <div class="w-full space-y-5 mb-6">
            <div>
                <label class="block text-neonX font-orbitron font-bold text-xs tracking-wider uppercase mb-1.5">Player 1 (X)</label>
                <input type="text" id="inputPlayerX" value="Player 1" maxlength="12" 
                    class="w-full bg-cellBg border-2 border-slate-700 focus:border-neonX text-textMain font-bold text-lg px-4 py-3 rounded-xl outline-none transition duration-200 text-center uppercase tracking-wide">
            </div>

            <div>
                <label class="block text-neonO font-orbitron font-bold text-xs tracking-wider uppercase mb-1.5">Player 2 (O)</label>
                <input type="text" id="inputPlayerO" value="Player 2" maxlength="12" 
                    class="w-full bg-cellBg border-2 border-slate-700 focus:border-neonO text-textMain font-bold text-lg px-4 py-3 rounded-xl outline-none transition duration-200 text-center uppercase tracking-wide">
            </div>
        </div>

        <!-- Error Message -->
        <div id="startError" class="h-6 text-red-400 font-bold text-sm text-center mb-2"></div>

        <!-- Play Button -->
        <button onclick="startGame()" class="w-full btn-neon-green text-bgDark font-orbitron font-black text-lg py-4 rounded-xl tracking-wider uppercase mb-3">
            ▶ PLAY GAME
        </button>
    </div>

    <!-- GAME SCREEN -->
    <div id="gameScreen" class="w-full max-w-md flex flex-col hidden z-10">
        <!-- Scoreboard -->
        <div class="grid grid-cols-3 gap-3 mb-4">
            <!-- Player X Score -->
            <div id="cardX" class="bg-panelDark rounded-2xl overflow-hidden border border-slate-800/80 flex flex-col items-center">
                <div class="w-full h-1 bg-neonX"></div>
                <span class="text-textMuted font-orbitron text-[10px] sm:text-xs font-bold uppercase mt-2">X WINS</span>
                <span id="nameDisplayX" class="text-neonX font-bold text-xs truncate max-w-[90%]">Player 1</span>
                <span id="scoreX" class="font-orbitron font-black text-2xl sm:text-3xl text-textMain my-1">0</span>
            </div>

            <!-- Draws Score -->
            <div id="cardD" class="bg-panelDark rounded-2xl overflow-hidden border border-slate-800/80 flex flex-col items-center">
                <div class="w-full h-1 bg-textMuted"></div>
                <span class="text-textMuted font-orbitron text-[10px] sm:text-xs font-bold uppercase mt-2">DRAWS</span>
                <span class="text-textMuted font-bold text-xs">TIED</span>
                <span id="scoreD" class="font-orbitron font-black text-2xl sm:text-3xl text-textMain my-1">0</span>
            </div>

            <!-- Player O Score -->
            <div id="cardO" class="bg-panelDark rounded-2xl overflow-hidden border border-slate-800/80 flex flex-col items-center">
                <div class="w-full h-1 bg-neonO"></div>
                <span class="text-textMuted font-orbitron text-[10px] sm:text-xs font-bold uppercase mt-2">O WINS</span>
                <span id="nameDisplayO" class="text-neonO font-bold text-xs truncate max-w-[90%]">Player 2</span>
                <span id="scoreO" class="font-orbitron font-black text-2xl sm:text-3xl text-textMain my-1">0</span>
            </div>
        </div>

        <!-- Turn Indicator -->
        <div class="text-center py-2 mb-1">
            <h2 id="turnDisplay" class="font-orbitron font-black text-xl sm:text-2xl text-neonX tracking-wider">
                X &nbsp; PLAYER 1'S TURN
            </h2>
        </div>

        <!-- Canvas Board Container -->
        <div class="relative w-full aspect-square my-2 bg-panelDark p-3 rounded-3xl border border-slate-800 shadow-2xl flex items-center justify-center">
            <canvas id="boardCanvas" class="w-full h-full rounded-2xl cursor-pointer"></canvas>
        </div>

        <!-- Banner / Notification Message -->
        <div class="h-12 flex items-center justify-center my-1 text-center px-2">
            <div id="gameBanner" class="font-orbitron font-bold text-lg text-textMain tracking-wide truncate">
                &nbsp;
            </div>
        </div>

        <!-- Control Buttons Grid (2x2) -->
        <div class="grid grid-cols-2 gap-2.5 mt-1">
            <button onclick="restartRound()" class="btn-action bg-[#1f6feb] text-white font-orbitron font-bold text-xs sm:text-sm py-3 px-3 rounded-xl flex items-center justify-center gap-1.5 shadow-md">
                <span>↻</span> RESTART GAME
            </button>
            <button onclick="promptResetScore()" class="btn-action bg-[#6e40c9] text-white font-orbitron font-bold text-xs sm:text-sm py-3 px-3 rounded-xl flex items-center justify-center gap-1.5 shadow-md">
                <span>⟲</span> RESET SCORE
            </button>
            <button onclick="goToMenu()" class="btn-action bg-panelDark hover:bg-cellHover border border-slate-700/60 text-textMain font-orbitron font-bold text-xs sm:text-sm py-3 px-3 rounded-xl flex items-center justify-center gap-1.5 shadow-md">
                <span>☰</span> MAIN MENU
            </button>
            <button onclick="promptQuit()" class="btn-action bg-[#b3261e] text-white font-orbitron font-bold text-xs sm:text-sm py-3 px-3 rounded-xl flex items-center justify-center gap-1.5 shadow-md">
                <span>✕</span> QUIT GAME
            </button>
        </div>
    </div>

    <!-- MODAL DIALOG -->
    <div id="customModal" class="fixed inset-0 modal-bg z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-panelDark border border-slate-700 p-6 sm:p-8 rounded-3xl max-w-sm w-full text-center shadow-2xl transform transition-all scale-100">
            <h3 id="modalTitle" class="font-orbitron font-bold text-xl text-textMain mb-2">Reset Score?</h3>
            <p id="modalBody" class="text-textMuted text-sm mb-6">Are you sure you want to reset all scores back to zero?</p>
            <div class="flex gap-3 justify-center">
                <button onclick="closeModal(false)" class="w-1/2 bg-cellBg hover:bg-cellHover text-textMain border border-slate-700 font-bold py-2.5 rounded-xl transition">
                    Cancel
                </button>
                <button id="modalConfirmBtn" onclick="closeModal(true)" class="w-1/2 bg-red-600 hover:bg-red-500 text-white font-bold py-2.5 rounded-xl transition shadow-lg">
                    Confirm
                </button>
            </div>
        </div>
    </div>

    <script>
        /* ---------------------------------------------------------------------------
         * 1. THEME & CONSTANTS
         * --------------------------------------------------------------------------- */
        const BG_COLOR = "#0b0f19";
        const PANEL_COLOR = "#151b2b";
        const CELL_BG = "#1b2336";
        const CELL_HOVER = "#243049";
        const X_COLOR = "#00e5ff";
        const O_COLOR = "#ff3d8b";
        const GOLD_COLOR = "#ffd60a";
        const MUTED_COLOR = "#7d8aa8";
        const RED_COLOR = "#ff5c5c";

        /* ---------------------------------------------------------------------------
         * 2. AUDIO SYNTHESIS (Web Audio API - Sci-Fi Neon SFX)
         * --------------------------------------------------------------------------- */
        let audioCtx = null;
        let soundMuted = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (soundMuted) return;
            try {
                initAudio();
                const now = audioCtx.currentTime;

                if (type === 'click') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'place') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(250, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.12);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'error') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(160, now);
                    osc.frequency.linearRampToValueAtTime(110, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                    notes.forEach((freq, i) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        const start = now + i * 0.08;
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, start);
                        gain.gain.setValueAtTime(0.2, start);
                        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.3);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(start);
                        osc.stop(start + 0.3);
                    });
                } else if (type === 'draw') {
                    const notes = [400, 350, 300];
                    notes.forEach((freq, i) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        const start = now + i * 0.1;
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, start);
                        gain.gain.setValueAtTime(0.15, start);
                        gain.gain.exponentialRampToValueAtTime(0.01, start + 0.2);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(start);
                        osc.stop(start + 0.2);
                    });
                }
            } catch (e) {
                // Ignore audio autoplay restrictions gracefully
            }
        }

        function toggleSound() {
            soundMuted = !soundMuted;
            document.getElementById('soundIcon').innerText = soundMuted ? '🔇' : '🔊';
            document.getElementById('soundText').innerText = soundMuted ? 'SFX OFF' : 'SFX ON';
            if (!soundMuted) playSound('click');
        }

        /* ---------------------------------------------------------------------------
         * 3. GAME LOGIC
         * --------------------------------------------------------------------------- */
        class GameLogic {
            static WIN_LINES = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8], // rows
                [0, 3, 6], [1, 4, 7], [2, 5, 8], // columns
                [0, 4, 8], [2, 4, 6]             // diagonals
            ];

            constructor() {
                this.reset();
            }

            reset() {
                this.board = Array(9).fill(null);
                this.current = "X";
                this.winner = null;
                this.winLine = null;
                this.gameOver = false;
            }

            get isDraw() {
                return this.gameOver && this.winner === null;
            }

            place(index) {
                if (this.gameOver || index < 0 || index > 8 || this.board[index] !== null) {
                    return false;
                }
                this.board[index] = this.current;
                this._evaluate();
                if (!this.gameOver) {
                    this.current = this.current === "X" ? "O" : "X";
                }
                return true;
            }

            _evaluate() {
                for (let line of GameLogic.WIN_LINES) {
                    const [a, b, c] = line;
                    if (this.board[a] && this.board[a] === this.board[b] && this.board[a] === this.board[c]) {
                        this.winner = this.board[a];
                        this.winLine = line;
                        this.gameOver = true;
                        return;
                    }
                }
                if (this.board.every(cell => cell !== null)) {
                    this.gameOver = true;
                }
            }
        }

        /* ---------------------------------------------------------------------------
         * 4. APP & GUI STATE
         * --------------------------------------------------------------------------- */
        const logic = new GameLogic();
        let playerNames = { X: "Player 1", O: "Player 2" };
        let scores = { X: 0, O: 0, D: 0 };

        // Canvas & Animation variables
        let canvas, ctx;
        let marks = {};        // cellIndex -> { symbol, progress }
        let winLine = null;    // winning line indices
        let winProgress = 0;   // 0..1
        let pulseTime = 0;     // for winning tile glow
        let hoverCell = null;
        let boardEnabled = true;
        let animFrameId = null;
        let bannerTimeout = null;

        // Helper Color Blend
        function blend(colorA, colorB, t) {
            t = Math.max(0, Math.min(1, t));
            const parse = hex => [
                parseInt(hex.slice(1, 3), 16),
                parseInt(hex.slice(3, 5), 16),
                parseInt(hex.slice(5, 7), 16)
            ];
            const a = parse(colorA);
            const b = parse(colorB);
            const mixed = a.map((val, i) => Math.round(val + (b[i] - val) * t));
            return `rgb(${mixed[0]}, ${mixed[1]}, ${mixed[2]})`;
        }

        function easeOut(p) {
            return 1 - Math.pow(1 - p, 3);
        }

        /* ---------------------------------------------------------------------------
         * 5. CANVAS RENDER ENGINE
         * --------------------------------------------------------------------------- */
        function initCanvas() {
            canvas = document.getElementById("boardCanvas");
            ctx = canvas.getContext("2d");

            // Handle DPI scaling and responsiveness
            function resize() {
                const rect = canvas.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                ctx.scale(dpr, dpr);
                draw();
            }

            window.addEventListener("resize", resize);
            
            // Mouse / Touch Interaction
            canvas.addEventListener("mousemove", handlePointerMove);
            canvas.addEventListener("mouseleave", handlePointerLeave);
            canvas.addEventListener("click", handlePointerClick);

            resize();
            startAnimLoop();
        }

        function getGeometry() {
            const rect = canvas.getBoundingClientRect();
            const width = rect.width;
            const height = rect.height;
            const pad = 12;
            const size = Math.max(30, Math.min(width, height) - 2 * pad);
            const x0 = (width - size) / 2;
            const y0 = (height - size) / 2;
            const cellSize = size / 3;
            return { x0, y0, cellSize };
        }

        function getCellAt(x, y) {
            const { x0, y0, cellSize } = getGeometry();
            const col = Math.floor((x - x0) / cellSize);
            const row = Math.floor((y - y0) / cellSize);
            if (col >= 0 && col < 3 && row >= 0 && row < 3) {
                return row * 3 + col;
            }
            return null;
        }

        function getCellCenter(index) {
            const { x0, y0, cellSize } = getGeometry();
            const row = Math.floor(index / 3);
            const col = index % 3;
            return {
                cx: x0 + (col + 0.5) * cellSize,
                cy: y0 + (row + 0.5) * cellSize
            };
        }

        function handlePointerMove(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const cell = getCellAt(x, y);

            if (cell !== hoverCell) {
                hoverCell = cell;
                const canClick = boardEnabled && hoverCell !== null && !marks[hoverCell];
                canvas.style.cursor = canClick ? "pointer" : "default";
            }
        }

        function handlePointerLeave() {
            hoverCell = null;
            canvas.style.cursor = "default";
        }

        function handlePointerClick(e) {
            if (!boardEnabled) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const cell = getCellAt(x, y);
            if (cell !== null) {
                onCellClicked(cell);
            }
        }

        function roundRect(ctx, x, y, w, h, r, fill, stroke) {
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, r);
            if (fill) {
                ctx.fillStyle = fill;
                ctx.fill();
            }
            if (stroke) {
                ctx.strokeStyle = stroke;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function startAnimLoop() {
            function tick() {
                let busy = false;

                // Update stroke progress for X and O
                for (let key in marks) {
                    if (marks[key].progress < 1) {
                        marks[key].progress = Math.min(1.0, marks[key].progress + 0.08);
                        busy = true;
                    }
                }

                // Update winning line & pulsing animation
                if (winLine) {
                    if (winProgress < 1) {
                        winProgress = Math.min(1.0, winProgress + 0.05);
                        busy = true;
                    }
                    pulseTime += 0.08;
                    busy = true;
                }

                draw();
                animFrameId = requestAnimationFrame(tick);
            }
            if (!animFrameId) {
                tick();
            }
        }

        function draw() {
            if (!ctx) return;
            const rect = canvas.getBoundingClientRect();
            ctx.clearRect(0, 0, rect.width, rect.height);

            const { x0, y0, cellSize } = getGeometry();
            const gap = cellSize * 0.06;

            // 1. Draw Grid Tiles
            for (let i = 0; i < 9; i++) {
                const row = Math.floor(i / 3);
                const col = i % 3;
                const left = x0 + col * cellSize + gap;
                const top = y0 + row * cellSize + gap;
                const size = cellSize - 2 * gap;

                let fill = CELL_BG;
                let stroke = CELL_BG;

                if (winLine && winLine.includes(i)) {
                    const glow = (Math.sin(pulseTime) + 1) / 2;
                    fill = blend(CELL_BG, GOLD_COLOR, 0.2 + 0.25 * glow);
                    stroke = GOLD_COLOR;
                } else if (boardEnabled && i === hoverCell && !marks[i]) {
                    fill = CELL_HOVER;
                    stroke = logic.current === "X" ? X_COLOR : O_COLOR;
                }

                roundRect(ctx, left, top, size, size, cellSize * 0.12, fill, stroke);
            }

            // 2. Draw Marks (X and O)
            for (let index in marks) {
                const { symbol, progress } = marks[index];
                const { cx, cy } = getCellCenter(parseInt(index));
                drawSymbol(symbol, cx, cy, cellSize, easeOut(progress));
            }

            // 3. Draw Winning Line
            if (winLine) {
                const p1 = getCellCenter(winLine[0]);
                const p2 = getCellCenter(winLine[2]);
                const p = easeOut(winProgress);

                const currentX = p1.cx + (p2.cx - p1.cx) * p;
                const currentY = p1.cy + (p2.cy - p1.cy) * p;

                ctx.beginPath();
                ctx.moveTo(p1.cx, p1.cy);
                ctx.lineTo(currentX, currentY);
                ctx.strokeStyle = GOLD_COLOR;
                ctx.lineWidth = Math.max(5, cellSize * 0.07);
                ctx.lineCap = "round";
                ctx.shadowColor = GOLD_COLOR;
                ctx.shadowBlur = 15;
                ctx.stroke();
                ctx.shadowBlur = 0; // Reset shadow
            }
        }

        function drawSymbol(symbol, cx, cy, cellSize, p) {
            const width = Math.max(4, cellSize * 0.08);
            const color = symbol === "X" ? X_COLOR : O_COLOR;

            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.lineCap = "round";
            ctx.shadowColor = color;
            ctx.shadowBlur = 10;

            if (symbol === "X") {
                const r = cellSize * 0.24;
                const p1 = Math.min(p * 2, 1);
                const p2 = Math.max(0, Math.min((p - 0.5) * 2, 1));

                // Stroke 1: Top-Left to Bottom-Right
                if (p1 > 0) {
                    ctx.beginPath();
                    ctx.moveTo(cx - r, cy - r);
                    ctx.lineTo(cx - r + 2 * r * p1, cy - r + 2 * r * p1);
                    ctx.stroke();
                }
                // Stroke 2: Top-Right to Bottom-Left
                if (p2 > 0) {
                    ctx.beginPath();
                    ctx.moveTo(cx + r, cy - r);
                    ctx.lineTo(cx + r - 2 * r * p2, cy - r + 2 * r * p2);
                    ctx.stroke();
                }
            } else {
                const r = cellSize * 0.26;
                if (p >= 0.99) {
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    ctx.stroke();
                } else if (p > 0.01) {
                    ctx.beginPath();
                    // Clockwise arc starting from top (-PI/2)
                    ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * p), false);
                    ctx.stroke();
                }
            }
            ctx.shadowBlur = 0; // Reset shadow
        }

        /* ---------------------------------------------------------------------------
         * 6. GAME FLOW & CONTROLLER
         * --------------------------------------------------------------------------- */
        function startGame() {
            initAudio();
            playSound('click');
            const xVal = document.getElementById("inputPlayerX").value.trim() || "Player 1";
            const oVal = document.getElementById("inputPlayerO").value.trim() || "Player 2";

            if (xVal.toLowerCase() === oVal.toLowerCase()) {
                document.getElementById("startError").innerText = "Please choose two different names!";
                playSound('error');
                return;
            }

            document.getElementById("startError").innerText = "";
            playerNames.X = xVal;
            playerNames.O = oVal;

            document.getElementById("nameDisplayX").innerText = playerNames.X;
            document.getElementById("nameDisplayO").innerText = playerNames.O;

            scores = { X: 0, O: 0, D: 0 };
            updateScoreDisplay();

            document.getElementById("startScreen").classList.add("hidden");
            document.getElementById("gameScreen").classList.remove("hidden");

            initCanvas();
            restartRound();
        }

        function restartRound() {
            playSound('click');
            logic.reset();
            marks = {};
            winLine = null;
            winProgress = 0;
            pulseTime = 0;
            boardEnabled = true;
            clearBanner();
            updateTurnDisplay();
        }

        function onCellClicked(index) {
            if (!boardEnabled || logic.gameOver) return;

            const currentSymbol = logic.current;
            if (!logic.place(index)) {
                // Invalid cell move
                playSound('error');
                showBanner("That cell is already taken!", RED_COLOR, 1200);
                return;
            }

            // Cell accepted
            playSound('place');
            marks[index] = { symbol: currentSymbol, progress: 0.0 };

            if (logic.winner) {
                handleWin(currentSymbol);
            } else if (logic.isDraw) {
                handleDraw();
            } else {
                updateTurnDisplay();
            }
        }

        function handleWin(symbol) {
            scores[symbol]++;
            updateScoreDisplay(symbol);
            winLine = logic.winLine;
            winProgress = 0;
            boardEnabled = false;

            playSound('win');

            const turnDisplay = document.getElementById("turnDisplay");
            turnDisplay.innerText = "GAME OVER";
            turnDisplay.className = "font-orbitron font-black text-xl sm:text-2xl text-neonGold glow-gold tracking-wider";

            const banner = document.getElementById("gameBanner");
            banner.innerHTML = `<span class="pulse-banner text-neonGold">★ ${playerNames[symbol]} (${symbol}) WINS! ★</span>`;
        }

        function handleDraw() {
            scores.D++;
            updateScoreDisplay('D');
            boardEnabled = false;

            playSound('draw');

            const turnDisplay = document.getElementById("turnDisplay");
            turnDisplay.innerText = "GAME OVER";
            turnDisplay.className = "font-orbitron font-black text-xl sm:text-2xl text-textMuted tracking-wider";

            const banner = document.getElementById("gameBanner");
            banner.innerText = "It's a draw! Nobody wins this round.";
            banner.style.color = MUTED_COLOR;
        }

        function updateTurnDisplay() {
            const turnDisplay = document.getElementById("turnDisplay");
            const symbol = logic.current;
            const name = playerNames[symbol];

            if (symbol === "X") {
                turnDisplay.innerText = `X   ${name.toUpperCase()}'S TURN`;
                turnDisplay.className = "font-orbitron font-black text-xl sm:text-2xl text-neonX glow-x tracking-wider";
            } else {
                turnDisplay.innerText = `O   ${name.toUpperCase()}'S TURN`;
                turnDisplay.className = "font-orbitron font-black text-xl sm:text-2xl text-neonO glow-o tracking-wider";
            }
        }

        function updateScoreDisplay(flashKey = null) {
            document.getElementById("scoreX").innerText = scores.X;
            document.getElementById("scoreD").innerText = scores.D;
            document.getElementById("scoreO").innerText = scores.O;

            if (flashKey) {
                const cardMap = { X: "scoreX", O: "scoreO", D: "scoreD" };
                const el = document.getElementById(cardMap[flashKey]);
                if (el) {
                    el.classList.remove("flash-score");
                    void el.offsetWidth; // trigger reflow
                    el.classList.add("flash-score");
                }
            }
        }

        function showBanner(text, color, duration = 0) {
            clearTimeout(bannerTimeout);
            const banner = document.getElementById("gameBanner");
            banner.innerText = text;
            banner.style.color = color;

            if (duration > 0) {
                bannerTimeout = setTimeout(() => {
                    if (!logic.gameOver) {
                        banner.innerText = " ";
                    }
                }, duration);
            }
        }

        function clearBanner() {
            clearTimeout(bannerTimeout);
            const banner = document.getElementById("gameBanner");
            banner.innerText = "\u00A0"; // Non-breaking space
        }

        function goToMenu() {
            playSound('click');
            document.getElementById("gameScreen").classList.add("hidden");
            document.getElementById("startScreen").classList.remove("hidden");
        }

        /* ---------------------------------------------------------------------------
         * 7. CUSTOM MODALS (Confirmation Dialogs)
         * --------------------------------------------------------------------------- */
        let modalCallback = null;

        function showCustomModal(title, body, confirmText, callback) {
            playSound('click');
            document.getElementById("modalTitle").innerText = title;
            document.getElementById("modalBody").innerText = body;
            document.getElementById("modalConfirmBtn").innerText = confirmText;
            modalCallback = callback;
            document.getElementById("customModal").classList.remove("hidden");
        }

        function closeModal(confirmed) {
            playSound('click');
            document.getElementById("customModal").classList.add("hidden");
            if (confirmed && modalCallback) {
                modalCallback();
            }
            modalCallback = null;
        }

        function promptResetScore() {
            showCustomModal(
                "Reset Score?",
                "Are you sure you want to reset all wins and draws back to zero?",
                "Reset",
                () => {
                    scores = { X: 0, O: 0, D: 0 };
                    updateScoreDisplay();
                }
            );
        }

        function promptQuit() {
            showCustomModal(
                "Quit Game?",
                "Return to main menu and reset the board?",
                "Quit",
                () => {
                    goToMenu();
                }
            );
        }
    </script>
</body>
